[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-x-idfc"
version = "1.0.0"
description = "Production-grade Banking Conversational AI with Two-Layer RAG, OCR Ambiguity Detection, and Zero-Internet Grounding"
readme = "README.md"
authors = [
    { name = "CHATGPTxIDFC Team" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "scikit-learn>=1.4.1.post1",
    "numpy>=1.26.4",
    "httpx>=0.27.0",
    "pytest>=8.1.1",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
